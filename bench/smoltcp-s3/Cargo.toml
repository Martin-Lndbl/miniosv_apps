[package]
name = "osv_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# The stack itself lives in the miniOSv tree, beside modules/miniext, because
# that is where the kernel's build can reach it -- DuckDB links the same crate.
# Both are submodules of miniosv_ctrl and are always checked out side by side,
# which is the same assumption the justfile here already makes about .env.
[dependencies]
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[dependencies.mininet]
path = "../../../miniosv/modules/mininet/rust"
